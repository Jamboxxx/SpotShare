<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpotShare - Urban Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #1a1a1a;
      color: #fff;
    }

    #map {
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100vh;
      background: #2d2d2d;
      box-shadow: -2px 0 10px rgba(0,0,0,0.3);
      transition: right 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .sidebar.open {
      right: 0;
    }

    .sidebar-toggle {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      max-width: 800px;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      z-index: 1001;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .sidebar-toggle:hover {
      background: #45a049;
    }

    .auth-container, .app-container {
      display: none;
    }

    .auth-container.active, .app-container.active {
      display: block;
    }

    .auth-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #2d2d2d;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      min-width: 350px;
      z-index: 2000;
    }

    h1, h2, h3 {
      margin-bottom: 20px;
      color: #4CAF50;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #ccc;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 5px;
      background: #1a1a1a;
      color: #fff;
      font-size: 14px;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 5px;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      background: #45a049;
    }

    button.secondary {
      background: #666;
    }

    button.secondary:hover {
      background: #555;
    }

    button.danger {
      background: #f44336;
    }

    button.danger:hover {
      background: #da190b;
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-buttons button {
      flex: 1;
      margin-top: 0;
    }

    .section {
      display: none;
      margin-bottom: 20px;
    }

    .section.active {
      display: block;
    }

    .pin-item, .group-item, .code-item {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .pin-item h4, .group-item h4 {
      color: #4CAF50;
      margin-bottom: 8px;
    }

    .pin-item p, .group-item p {
      color: #ccc;
      font-size: 14px;
      margin: 5px 0;
    }

    .pin-images {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .pin-images img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 3px;
      cursor: pointer;
    }

    .error {
      background: #f44336;
      color: white;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .success {
      background: #4CAF50;
      color: white;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .toggle-auth {
      text-align: center;
      margin-top: 15px;
      color: #ccc;
    }

    .toggle-auth a {
      color: #4CAF50;
      cursor: pointer;
      text-decoration: none;
    }

    .toggle-auth a:hover {
      text-decoration: underline;
    }

    .small-button {
      padding: 8px 12px;
      font-size: 12px;
      width: auto;
      display: inline-block;
      margin: 5px 5px 5px 0;
    }

    .code-display {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 18px;
      text-align: center;
      margin: 10px 0;
      color: #4CAF50;
      letter-spacing: 2px;
    }

    .user-info {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #2d2d2d;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .close-modal {
      float: right;
      font-size: 24px;
      cursor: pointer;
      color: #ccc;
    }

    .close-modal:hover {
      color: #fff;
    }

    .map-layer-switcher {
      position: fixed;
      top: 80px;
      right: 20px;
      background: white;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      z-index: 400;
    }

    .map-layer-switcher button {
      display: block;
      width: 100%;
      padding: 10px 15px;
      background: white;
      border: none;
      color: #333;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
      transition: background 0.15s;
    }

    .map-layer-switcher button:hover {
      background: #f0f0f0;
    }

    .map-layer-switcher button.active {
      background: #4CAF50;
      color: white;
    }

    .map-layer-switcher button:not(:last-child) {
      border-bottom: 1px solid #e0e0e0;
    }

    .leaflet-popup-content {
      color: #000;
    }

    .popup-image {
      width: 100%;
      max-width: 200px;
      margin-top: 10px;
      border-radius: 5px;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        right: -100%;
        padding-top: 80px;
      }
      
    }
  </style>
</head>
<body>
  <!-- Auth Container -->
  <div class="auth-container active" id="authContainer">
    <div class="auth-box">
      <h1>SpotShare</h1>
      
      <!-- Login Form -->
      <div id="loginForm">
        <h2>Login</h2>
        <div id="loginError" class="error" style="display:none;"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button onclick="login()">Login</button>
        <div class="toggle-auth">
          Don't have an account? <a onclick="showRegister()">Register</a>
        </div>
      </div>

      <!-- Register Form -->
      <div id="registerForm" style="display:none;">
        <h2>Register</h2>
        <div id="registerError" class="error" style="display:none;"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="registerUsername" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="registerPassword" required>
        </div>
        <div class="form-group">
          <label>Referral Code</label>
          <input type="text" id="registerReferralCode" required>
        </div>
        <button onclick="register()">Register</button>
        <div class="toggle-auth">
          Already have an account? <a onclick="showLogin()">Login</a>
        </div>
      </div>
    </div>
  </div>

  <!-- App Container -->
  <div class="app-container" id="appContainer">
    <div id="map"></div>
    
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰ Menu</button>

    <div class="map-layer-switcher" id="mapLayerSwitcher">
      <button id="btnStreet" class="active" onclick="changeMapLayer('street')">Street</button>
      <button id="btnSatellite" onclick="changeMapLayer('satellite')">Satellite</button>
    </div>
    
    <div class="sidebar" id="sidebar">
      <div class="user-info">
        <h3 id="userNameDisplay"></h3>
        <button class="secondary" onclick="logout()">Logout</button>
      </div>

      <div class="tab-buttons">
        <button onclick="showSection('pins')" id="pinsTab">My Pins</button>
        <button class="secondary" onclick="showSection('groups')" id="groupsTab">Groups</button>
        <button class="secondary" onclick="showSection('referrals')" id="referralsTab">Codes</button>        <button class="secondary" onclick="showSection('admin')" id="adminTab" style="display:none;">Admin</button>      </div>

      <!-- Pins Section -->
      <div class="section active" id="pinsSection">
        <button onclick="openAddPinModal()">+ Add Pin</button>
        <button class="secondary" onclick="openImportGPXModal()">Import GPX</button>
        <h3 style="margin-top: 20px;">Your Pins</h3>
        <div id="pinsList"></div>
      </div>

      <!-- Groups Section -->
      <div class="section" id="groupsSection">
        <button onclick="openCreateGroupModal()">+ Create Group</button>
        <button class="secondary" onclick="openJoinGroupModal()">Join Group</button>
        <h3 style="margin-top: 20px;">Your Groups</h3>
        <div id="groupsList"></div>
      </div>

      <!-- Referrals Section -->
      <div class="section" id="referralsSection">
        <button onclick="generateReferralCode()">Generate New Code</button>
        <h3 style="margin-top: 20px;">Your Referral Codes</h3>
        <div id="referralsList"></div>
      </div>

      <!-- Admin Section -->
      <div class="section" id="adminSection">
        <div class="tab-buttons" style="margin-bottom: 15px;">
          <button class="secondary" onclick="loadAdminUsers()" id="adminUsersBtn">Users</button>
          <button class="secondary" onclick="loadAdminGroups()" id="adminGroupsBtn">Groups</button>
        </div>
        <div id="adminContent"></div>
      </div>
    </div>
  </div>

  <!-- Add Pin Modal -->
  <div class="modal" id="addPinModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('addPinModal')">&times;</span>
      <h2>Add New Pin</h2>
      <div id="addPinError" class="error" style="display:none;"></div>
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="pinTitle" required>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="pinDescription" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Latitude *</label>
        <input type="text" id="pinLat" required placeholder="Click on map to set">
      </div>
      <div class="form-group">
        <label>Longitude *</label>
        <input type="text" id="pinLon" required placeholder="Click on map to set">
      </div>
      <div class="form-group">
        <label>Images (max 5)</label>
        <input type="file" id="pinImages" accept="image/*" multiple>
      </div>
      <button onclick="addPin()">Add Pin</button>
      <button class="secondary" onclick="closeModal('addPinModal')">Cancel</button>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div class="modal" id="createGroupModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('createGroupModal')">&times;</span>
      <h2>Create Group</h2>
      <div id="createGroupError" class="error" style="display:none;"></div>
      <div class="form-group">
        <label>Group Name *</label>
        <input type="text" id="groupName" required>
      </div>
      <button onclick="createGroup()">Create Group</button>
      <button class="secondary" onclick="closeModal('createGroupModal')">Cancel</button>
    </div>
  </div>

  <!-- Join Group Modal -->
  <div class="modal" id="joinGroupModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('joinGroupModal')">&times;</span>
      <h2>Join Group</h2>
      <div id="joinGroupError" class="error" style="display:none;"></div>
      <div class="form-group">
        <label>Invite Code *</label>
        <input type="text" id="joinGroupCode" required>
      </div>
      <button onclick="joinGroup()">Join Group</button>
      <button class="secondary" onclick="closeModal('joinGroupModal')">Cancel</button>
    </div>
  </div>

  <!-- Import GPX Modal -->
  <div class="modal" id="importGPXModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal('importGPXModal')">&times;</span>
      <h2>Import GPX File</h2>
      <div id="importGPXError" class="error" style="display:none;"></div>
      <div id="importGPXSuccess" class="success" style="display:none;"></div>
      <div class="form-group">
        <label>GPX File *</label>
        <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" required>
      </div>
      <button onclick="importGPX()">Import</button>
      <button class="secondary" onclick="closeModal('importGPXModal')">Cancel</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
